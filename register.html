<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Create your Luxe Events account to book and manage premium events.">
  <title>Register | Luxe Events</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = { darkMode: 'class' }
  </script>
  <link rel="stylesheet" href="css/styles.css">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js" defer></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/ScrollTrigger.min.js" defer></script>
  <script src="js/main.js" defer></script>
  <script src="js/animations.js" defer></script>
  <style>
    /* matching booking.html style */
    .back-home {
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      color: #A8A29E;
      text-decoration: none;
      font-weight: 500;
      transition: color 0.3s;
      font-size: 0.95rem;
    }
    .back-home:hover {
      color: #D4AF37;
    }
    .header-back-row {
      padding: 1.25rem 1.5rem 0 1.5rem;
      max-width: 1280px;
      margin: 0 auto;
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 1rem;
    }

    /* Theme toggle button */
    .theme-toggle-btn {
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      padding: 0.4rem 0.8rem;
      border-radius: 9999px;
      border: 1px solid rgba(212, 175, 55, 0.2);
      background: rgba(20, 20, 20, 0.5);
      color: #A8A29E;
      cursor: pointer;
      transition: all 0.3s;
      font-size: 0.85rem;
    }
    .theme-toggle-btn:hover {
      border-color: #D4AF37;
      color: #D4AF37;
    }
    body.light-mode .theme-toggle-btn {
      background: rgba(255, 255, 255, 0.8);
      color: #57534E;
    }
    body.light-mode .theme-toggle-btn:hover {
      color: #D4AF37;
    }

    /* Light mode overrides */
    body.light-mode {
      background-color: #FAF9F6;
      color: #0A0A0A;
    }
    body.light-mode .glass-card {
      background: rgba(255, 255, 255, 0.9) !important;
      border-color: rgba(212, 175, 55, 0.15) !important;
    }
    body.light-mode .form-input {
      background: rgba(255, 255, 255, 0.9) !important;
      color: #0A0A0A !important;
      border-color: rgba(212, 175, 55, 0.2) !important;
    }
    body.light-mode .form-input::placeholder {
      color: #A8A29E !important;
    }
    body.light-mode .auth-card {
      background: rgba(255, 255, 255, 0.9) !important;
    }
    body.light-mode .section-label {
      color: #B8860B;
    }
    body.light-mode .text-secondary {
      color: #57534E !important;
    }
    body.light-mode .text-gradient {
      background: linear-gradient(135deg, #B8860B, #D4AF37, #F5D061);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }
  </style>
</head>
<body>

 
  <!-- ===== HEADER with BACK TO HOME & THEME TOGGLE ===== -->
  <header>
    <!-- header row with back button and theme toggle -->
    <div class="header-back-row">
      <a href="index.html" class="back-home">
        <svg width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M15 18l-6-6 6-6"/></svg>
        Back to Home
      </a>
      <button id="theme-toggle-btn" class="theme-toggle-btn" aria-label="Toggle dark/light mode">
        <svg id="theme-icon-sun" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><circle cx="12" cy="12" r="5"/><path d="M12 1v2M12 21v2M4.22 4.22l1.42 1.42M18.36 18.36l1.42 1.42M1 12h2M21 12h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42"/></svg>
        <svg id="theme-icon-moon" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24" style="display:none;"><path d="M21 12.79A9 9 0 1111.21 3 7 7 0 0021 12.79z"/></svg>
        <span id="theme-label">Light Mode</span>
      </button>
    </div>
  </header>

  <!-- ===== ORIGINAL NAV REMOVED ===== -->

  <main class="auth-page" style="padding-top: 1.5rem;">
    <div class="auth-card">
      <div class="text-center mb-8">
        <h1 class="font-display text-3xl font-bold mb-2">Create Account</h1>
        <p style="color: var(--text-secondary);">Join Asquare Events and start planning extraordinary moments</p>
      </div>

      <form id="register-form" novalidate>
        <div class="form-group">
          <label for="register-username" class="form-label">Username</label>
          <input type="text" id="register-username" name="username" class="form-input" placeholder="Choose a username" autocomplete="username" required aria-required="true">
          <span class="form-error" role="alert"></span>
        </div>

        <div class="form-group">
          <label for="register-email" class="form-label">Email Address</label>
          <input type="email" id="register-email" name="email" class="form-input" placeholder="you@example.com" autocomplete="email" required aria-required="true">
          <span class="form-error" role="alert"></span>
        </div>

        <div class="form-group">
          <label for="register-password" class="form-label">Password</label>
          <div class="relative">
            <input type="password" id="register-password" name="password" class="form-input pr-12" placeholder="Create a strong password" autocomplete="new-password" required aria-required="true">
            <button type="button" class="password-toggle" aria-label="Show password">
              <svg width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
            </button>
          </div>
          <div class="strength-bar"><div id="strength-fill" class="strength-fill"></div></div>
          <p id="strength-text" class="strength-text"></p>
          <span class="form-error" role="alert"></span>
        </div>

        <div class="form-group">
          <label for="register-confirm" class="form-label">Confirm Password</label>
          <div class="relative">
            <input type="password" id="register-confirm" name="confirm_password" class="form-input pr-12" placeholder="Confirm your password" autocomplete="new-password" required aria-required="true">
            <button type="button" class="password-toggle" aria-label="Show password">
              <svg width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
            </button>
          </div>
          <span class="form-error" role="alert"></span>
        </div>

        <div class="form-group mb-6">
          <label class="custom-checkbox">
            <input type="checkbox" name="terms" required aria-required="true">
            <span class="checkmark"></span>
            I accept the <a href="#" class="underline" style="color: var(--accent-gold);">Terms & Conditions</a>
          </label>
          <span class="form-error terms-error" role="alert" style="display: none;">You must accept the terms and conditions</span>
        </div>

        <button type="submit" class="btn-primary w-full mb-6">Create Account</button>
      </form>

      <p class="auth-footer text-center text-sm" style="color: var(--text-secondary);">
        Already have an account? <a href="login.html" class="font-semibold hover:underline" style="color: var(--accent-gold);">Sign in</a>
      </p>
    </div>
  </main>

  <script>
    // Theme toggle functionality
    (function() {
      const toggleBtn = document.getElementById('theme-toggle-btn');
      const iconSun = document.getElementById('theme-icon-sun');
      const iconMoon = document.getElementById('theme-icon-moon');
      const label = document.getElementById('theme-label');

      // Check for saved theme preference
      if (localStorage.getItem('theme') === 'light') {
        document.body.classList.add('light-mode');
        iconSun.style.display = 'none';
        iconMoon.style.display = 'block';
        label.textContent = 'Dark Mode';
      }

      toggleBtn.addEventListener('click', function() {
        document.body.classList.toggle('light-mode');
        const isLight = document.body.classList.contains('light-mode');
        
        if (isLight) {
          iconSun.style.display = 'none';
          iconMoon.style.display = 'block';
          label.textContent = 'Dark Mode';
          localStorage.setItem('theme', 'light');
        } else {
          iconSun.style.display = 'block';
          iconMoon.style.display = 'none';
          label.textContent = 'Light Mode';
          localStorage.setItem('theme', 'dark');
        }
      });
    })();
  </script>

</body>
</html>

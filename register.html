<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Create your Asquare Events account to book and manage premium events." />
  <title>Register · Asquare Events</title>
  <!-- Google Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;500;600;700&family=Montserrat:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
  <!-- Bootstrap 5 -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet" />
  <!-- GSAP & ScrollTrigger -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js" defer></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/ScrollTrigger.min.js" defer></script>
  
  <style>
    /* ===== BASE ===== */
    body {
      font-family: 'Montserrat', system-ui, sans-serif;
      background-color: #0A0A0A;
      color: #FAFAF9;
      padding: 2rem 1rem 4rem;
    }
    
    /* ===== LIGHT MODE ===== */
    body.light-mode {
      background-color: #FAF9F6;
      color: #0A0A0A;
    }
    body.light-mode .glass-card {
      background: rgba(255, 255, 255, 0.9) !important;
    }
    body.light-mode .auth-card {
      background: rgba(255, 255, 255, 0.9) !important;
    }
    body.light-mode .form-input {
      background: rgba(255, 255, 255, 0.9) !important;
      color: #0A0A0A !important;
      border-color: rgba(212, 175, 55, 0.2) !important;
    }
    body.light-mode .form-input::placeholder {
      color: #A8A29E !important;
    }
    body.light-mode .text-secondary-custom {
      color: #57534E !important;
    }
    body.light-mode .text-secondary {
      color: #57534E !important;
    }
    
    /* ===== FONTS ===== */
    .font-display {
      font-family: 'Cinzel', serif;
      letter-spacing: 0.04em;
    }
    
    /* ===== GOLD TEXT ===== */
    .text-gold {
      color: #D4AF37;
    }
    .text-gradient {
      background: linear-gradient(135deg, #B8860B, #D4AF37, #F5D061);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }
    
    /* ===== GLASS CARD ===== */
    .glass-card {
      background: rgba(20, 20, 20, 0.75);
      backdrop-filter: blur(16px);
      border: 1px solid rgba(212, 175, 55, 0.15);
      box-shadow: 0 8px 32px rgba(0,0,0,0.5);
    }
    
    /* ===== BUTTONS ===== */
    .btn-gold {
      background: linear-gradient(135deg, #B8860B, #D4AF37, #F5D061);
      color: #fff;
      border: none;
      padding: 0.75rem 2rem;
      border-radius: 9999px;
      font-weight: 600;
      transition: all 0.3s;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      text-decoration: none;
      font-size: 1rem;
      width: 100%;
    }
    .btn-gold:hover {
      transform: translateY(-2px);
      box-shadow: 0 0 40px rgba(212, 175, 55, 0.2);
      color: #fff;
    }
    
    /* ===== AUTH CARD ===== */
    .auth-card {
      max-width: 440px;
      margin: 0 auto;
      padding: 2.5rem 2.5rem;
      border-radius: 1.5rem;
      background: rgba(20, 20, 20, 0.75);
      border: 1px solid rgba(212, 175, 55, 0.15);
      box-shadow: 0 8px 32px rgba(0,0,0,0.5);
    }
    
    /* ===== FORM INPUTS ===== */
    .form-input {
      width: 100%;
      padding: 0.85rem 1.1rem;
      background: rgba(20, 20, 20, 0.75);
      border: 1px solid rgba(212, 175, 55, 0.15);
      border-radius: 0.75rem;
      color: #FAFAF9;
      font-size: 0.95rem;
      transition: border-color 0.3s, box-shadow 0.3s;
      outline: none;
      font-family: 'Montserrat', system-ui, sans-serif;
    }
    .form-input:focus {
      border-color: #D4AF37;
      box-shadow: 0 0 0 3px rgba(212, 175, 55, 0.15);
    }
    .form-input::placeholder {
      color: #78716C;
    }
    .form-label {
      display: block;
      font-size: 0.85rem;
      font-weight: 600;
      margin-bottom: 0.5rem;
      color: #D4AF37;
      letter-spacing: 0.02em;
    }
    .form-group {
      margin-bottom: 1.5rem;
    }
    .form-group:last-of-type {
      margin-bottom: 1.75rem;
    }
    
    /* ===== PASSWORD TOGGLE ===== */
    .password-wrapper {
      position: relative;
    }
    .password-wrapper .form-input {
      padding-right: 3rem;
    }
    .password-toggle {
      position: absolute;
      right: 0.75rem;
      top: 50%;
      transform: translateY(-50%);
      background: none;
      border: none;
      color: #78716C;
      cursor: pointer;
      padding: 0.25rem;
      transition: color 0.3s;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .password-toggle:hover {
      color: #D4AF37;
    }
    
    /* ===== CUSTOM CHECKBOX ===== */
    .custom-checkbox {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      font-size: 0.9rem;
      cursor: pointer;
      color: #A8A29E;
    }
    .custom-checkbox input[type="checkbox"] {
      width: 18px;
      height: 18px;
      accent-color: #D4AF37;
      cursor: pointer;
    }
    .custom-checkbox a {
      color: #D4AF37;
      text-decoration: none;
      transition: text-decoration 0.3s;
    }
    .custom-checkbox a:hover {
      text-decoration: underline;
    }
    
    /* ===== PASSWORD STRENGTH ===== */
    .strength-bar {
      height: 4px;
      background: rgba(212, 175, 55, 0.15);
      border-radius: 4px;
      margin-top: 0.5rem;
      overflow: hidden;
    }
    .strength-fill {
      height: 100%;
      width: 0%;
      border-radius: 4px;
      transition: width 0.4s ease, background 0.4s ease;
    }
    .strength-text {
      font-size: 0.7rem;
      margin-top: 0.25rem;
      color: #78716C;
      min-height: 1.2rem;
    }
    
    /* ===== THEME TOGGLE ===== */
    .theme-toggle {
      width: 40px;
      height: 40px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      background: rgba(20, 20, 20, 0.75);
      border: 1px solid rgba(212, 175, 55, 0.15);
      cursor: pointer;
      color: #FAFAF9;
      transition: all 0.3s;
    }
    .theme-toggle:hover {
      border-color: #D4AF37;
    }
    body.light-mode .theme-toggle {
      background: rgba(255, 255, 255, 0.9);
      color: #0A0A0A;
    }
    
    /* ===== BACK BUTTON ===== */
    .back-home {
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      color: #A8A29E;
      text-decoration: none;
      font-weight: 500;
      transition: color 0.3s;
      font-size: 0.95rem;
    }
    .back-home:hover {
      color: #D4AF37;
    }
    
    /* ===== UTILITIES ===== */
    .gold-line {
      width: 60px;
      height: 3px;
      background: linear-gradient(135deg, #B8860B, #D4AF37, #F5D061);
      margin: 0.5rem auto;
      border-radius: 4px;
    }
    .section-label {
      font-size: 0.75rem;
      font-weight: 700;
      letter-spacing: 0.15em;
      text-transform: uppercase;
      color: #D4AF37;
    }
    .text-secondary-custom {
      color: #A8A29E;
    }
    
    /* ===== ANIMATION CLASSES ===== */
    .gsap-reveal {
      opacity: 0;
      transform: translateY(30px);
    }
    
    /* ===== RESPONSIVE ===== */
    @media (max-width: 576px) {
      .auth-card {
        padding: 1.75rem 1.25rem;
      }
    }
  </style>
</head>
<body>

<!-- ===== BACK + THEME TOGGLE ===== -->
<div class="d-flex flex-wrap align-items-center justify-content-between mb-4">
  <a href="index.html" class="back-home">
    <svg width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M15 18l-6-6 6-6"/></svg>
    Back to Home
  </a>
  <button class="theme-toggle" onclick="document.body.classList.toggle('light-mode')" aria-label="Toggle theme">
    <svg width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><circle cx="12" cy="12" r="5"/><path d="M12 1v2M12 21v2M4.22 4.22l1.42 1.42M18.36 18.36l1.42 1.42M1 12h2M21 12h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42"/></svg>
  </button>
</div>

<!-- ===== HEADING ===== -->
<div style="text-align:center; padding:0.5rem 0 1.5rem;">
  <h1 class="font-display" style="font-size:clamp(2rem, 5vw, 3rem); font-weight:700;">
    <span class="text-gradient">Create Account</span>
  </h1>
  <div class="gold-line"></div>
  <p style="font-size:1rem; color:#A8A29E; max-width:400px; line-height:1.7; margin:0.75rem auto 0;">
    Join Asquare Events and start planning extraordinary moments
  </p>
</div>

<!-- ===== REGISTER FORM ===== -->
<section style="padding:0 0 2rem 0;">
  <div class="container">
    <div class="row justify-content-center">
      <div class="col-lg-6 col-md-8 col-sm-10">
        <div class="auth-card gsap-reveal">
          <form id="register-form" novalidate>
            <div class="form-group">
              <label for="register-username" class="form-label">Username</label>
              <input type="text" id="register-username" name="username" class="form-input" placeholder="Choose a username" autocomplete="username" required />
            </div>

            <div class="form-group">
              <label for="register-email" class="form-label">Email Address</label>
              <input type="email" id="register-email" name="email" class="form-input" placeholder="you@example.com" autocomplete="email" required />
            </div>

            <div class="form-group">
              <label for="register-password" class="form-label">Password</label>
              <div class="password-wrapper">
                <input type="password" id="register-password" name="password" class="form-input" placeholder="Create a strong password" autocomplete="new-password" required oninput="checkPasswordStrength(this.value)" />
                <button type="button" class="password-toggle" aria-label="Show password" onclick="togglePasswordVisibility('register-password', this)">
                  <svg width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
                </button>
              </div>
              <div class="strength-bar"><div id="strength-fill" class="strength-fill"></div></div>
              <p id="strength-text" class="strength-text"></p>
            </div>

            <div class="form-group">
              <label for="register-confirm" class="form-label">Confirm Password</label>
              <div class="password-wrapper">
                <input type="password" id="register-confirm" name="confirm_password" class="form-input" placeholder="Confirm your password" autocomplete="new-password" required />
                <button type="button" class="password-toggle" aria-label="Show password" onclick="togglePasswordVisibility('register-confirm', this)">
                  <svg width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
                </button>
              </div>
            </div>

            <div class="form-group mb-4">
              <label class="custom-checkbox">
                <input type="checkbox" name="terms" required />
                I accept the <a href="#">Terms &amp; Conditions</a>
              </label>
            </div>

            <button type="submit" class="btn-gold">Create Account</button>
          </form>

          <p class="text-center text-sm mt-4" style="color: var(--text-secondary);">
            Already have an account? <a href="login.html" class="fw-semibold" style="color: var(--accent-gold); text-decoration: none; transition: color 0.3s;" onmouseover="this.style.textDecoration='underline'" onmouseout="this.style.textDecoration='none'">Sign in</a>
          </p>
        </div>
      </div>
    </div>
  </div>
</section>

<!-- ===== FOOTER ===== -->
<footer style="text-align:center; padding:2rem 0 0.5rem; border-top:1px solid rgba(212,175,55,0.15); margin-top:1.5rem;">
  <p style="color:#78716C; font-size:0.8rem;">&copy; 2026 Asquare Events · All rights reserved.</p>
</footer>

<!-- Bootstrap JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

<!-- ===== GSAP ANIMATIONS ===== -->
<script>
  document.addEventListener('DOMContentLoaded', function() {
    if (typeof gsap !== 'undefined' && typeof ScrollTrigger !== 'undefined') {
      gsap.registerPlugin(ScrollTrigger);
      
      gsap.utils.toArray('.gsap-reveal').forEach(function(el) {
        gsap.fromTo(el, 
          { opacity: 0, y: 40 },
          {
            opacity: 1,
            y: 0,
            duration: 0.8,
            ease: 'power3.out',
            scrollTrigger: {
              trigger: el,
              start: 'top 85%',
              toggleActions: 'play none none none'
            }
          }
        );
      });
    } else {
      document.querySelectorAll('.gsap-reveal').forEach(function(el) {
        el.style.opacity = '1';
        el.style.transform = 'translateY(0)';
      });
    }
  });

  // ===== PASSWORD TOGGLE =====
  function togglePasswordVisibility(inputId, btn) {
    const input = document.getElementById(inputId);
    if (input.type === 'password') {
      input.type = 'text';
      btn.innerHTML = `
        <svg width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
          <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>
          <circle cx="12" cy="12" r="3"/>
          <line x1="1" y1="1" x2="23" y2="23" stroke="currentColor" stroke-width="2"/>
        </svg>
      `;
    } else {
      input.type = 'password';
      btn.innerHTML = `
        <svg width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
          <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>
          <circle cx="12" cy="12" r="3"/>
        </svg>
      `;
    }
  }

  // ===== PASSWORD STRENGTH =====
  function checkPasswordStrength(password) {
    const fill = document.getElementById('strength-fill');
    const text = document.getElementById('strength-text');
    
    let strength = 0;
    let msg = '';
    let color = '#78716C';
    
    if (password.length === 0) {
      fill.style.width = '0%';
      text.textContent = '';
      return;
    }
    
    if (password.length >= 8) strength += 1;
    if (password.match(/[a-z]/)) strength += 1;
    if (password.match(/[A-Z]/)) strength += 1;
    if (password.match(/[0-9]/)) strength += 1;
    if (password.match(/[^a-zA-Z0-9]/)) strength += 1;
    
    const percentage = (strength / 5) * 100;
    
    if (strength <= 1) {
      msg = 'Weak';
      color = '#EF4444';
    } else if (strength <= 2) {
      msg = 'Fair';
      color = '#F59E0B';
    } else if (strength <= 3) {
      msg = 'Good';
      color = '#3B82F6';
    } else if (strength <= 4) {
      msg = 'Strong';
      color = '#8B5CF6';
    } else {
      msg = 'Very Strong';
      color = '#10B981';
    }
    
    fill.style.width = percentage + '%';
    fill.style.background = color;
    text.textContent = msg;
    text.style.color = color;
  }
</script>

</body>
</html>

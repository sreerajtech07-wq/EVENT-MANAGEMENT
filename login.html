<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Login to your Asquare Events account to manage bookings and event details." />
  <title>Login · Asquare Events</title>
  <!-- Google Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;500;600;700&family=Montserrat:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
  <!-- Bootstrap 5 -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet" />
  <!-- GSAP & ScrollTrigger -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js" defer></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/ScrollTrigger.min.js" defer></script>
  
  <style>
    /* ===== BASE ===== */
    body {
      font-family: 'Montserrat', system-ui, sans-serif;
      background-color: #0A0A0A;
      color: #FAFAF9;
      padding: 2rem 1rem 4rem;
    }
    
    /* ===== LIGHT MODE ===== */
    body.light-mode {
      background-color: #FAF9F6;
      color: #0A0A0A;
    }
    body.light-mode .glass-card {
      background: rgba(255, 255, 255, 0.9) !important;
    }
    body.light-mode .auth-card {
      background: rgba(255, 255, 255, 0.9) !important;
    }
    body.light-mode .form-input {
      background: rgba(255, 255, 255, 0.9) !important;
      color: #0A0A0A !important;
      border-color: rgba(212, 175, 55, 0.2) !important;
    }
    body.light-mode .form-input::placeholder {
      color: #A8A29E !important;
    }
    body.light-mode .text-secondary-custom {
      color: #57534E !important;
    }
    body.light-mode .text-secondary {
      color: #57534E !important;
    }
    
    /* ===== FONTS ===== */
    .font-display {
      font-family: 'Cinzel', serif;
      letter-spacing: 0.04em;
    }
    
    /* ===== GOLD TEXT ===== */
    .text-gold {
      color: #D4AF37;
    }
    .text-gradient {
      background: linear-gradient(135deg, #B8860B, #D4AF37, #F5D061);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }
    
    /* ===== GLASS CARD ===== */
    .glass-card {
      background: rgba(20, 20, 20, 0.75);
      backdrop-filter: blur(16px);
      border: 1px solid rgba(212, 175, 55, 0.15);
      box-shadow: 0 8px 32px rgba(0,0,0,0.5);
    }
    
    /* ===== BUTTONS ===== */
    .btn-gold {
      background: linear-gradient(135deg, #B8860B, #D4AF37, #F5D061);
      color: #fff;
      border: none;
      padding: 0.75rem 2rem;
      border-radius: 9999px;
      font-weight: 600;
      transition: all 0.3s;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      text-decoration: none;
      font-size: 1rem;
      width: 100%;
    }
    .btn-gold:hover {
      transform: translateY(-2px);
      box-shadow: 0 0 40px rgba(212, 175, 55, 0.2);
      color: #fff;
    }
    
    /* ===== AUTH CARD ===== */
    .auth-card {
      max-width: 440px;
      margin: 0 auto;
      padding: 2.5rem 2.5rem;
      border-radius: 1.5rem;
      background: rgba(20, 20, 20, 0.75);
      border: 1px solid rgba(212, 175, 55, 0.15);
      box-shadow: 0 8px 32px rgba(0,0,0,0.5);
    }
    
    /* ===== FORM INPUTS ===== */
    .form-input {
      width: 100%;
      padding: 0.85rem 1.1rem;
      background: rgba(20, 20, 20, 0.75);
      border: 1px solid rgba(212, 175, 55, 0.15);
      border-radius: 0.75rem;
      color: #FAFAF9;
      font-size: 0.95rem;
      transition: border-color 0.3s, box-shadow 0.3s;
      outline: none;
      font-family: 'Montserrat', system-ui, sans-serif;
    }
    .form-input:focus {
      border-color: #D4AF37;
      box-shadow: 0 0 0 3px rgba(212, 175, 55, 0.15);
    }
    .form-input::placeholder {
      color: #78716C;
    }
    .form-label {
      display: block;
      font-size: 0.85rem;
      font-weight: 600;
      margin-bottom: 0.5rem;
      color: #D4AF37;
      letter-spacing: 0.02em;
    }
    .form-group {
      margin-bottom: 1.5rem;
    }
    .form-group:last-of-type {
      margin-bottom: 1.75rem;
    }
    
    /* ===== PASSWORD TOGGLE ===== */
    .password-wrapper {
      position: relative;
    }
    .password-wrapper .form-input {
      padding-right: 3rem;
    }
    .password-toggle {
      position: absolute;
      right: 0.75rem;
      top: 50%;
      transform: translateY(-50%);
      background: none;
      border: none;
      color: #78716C;
      cursor: pointer;
      padding: 0.25rem;
      transition: color 0.3s;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .password-toggle:hover {
      color: #D4AF37;
    }
    
    /* ===== CUSTOM CHECKBOX ===== */
    .custom-checkbox {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      font-size: 0.9rem;
      cursor: pointer;
      color: #A8A29E;
    }
    .custom-checkbox input[type="checkbox"] {
      width: 18px;
      height: 18px;
      accent-color: #D4AF37;
      cursor: pointer;
    }
    
    /* ===== THEME TOGGLE ===== */
    .theme-toggle {
      width: 40px;
      height: 40px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      background: rgba(20, 20, 20, 0.75);
      border: 1px solid rgba(212, 175, 55, 0.15);
      cursor: pointer;
      color: #FAFAF9;
      transition: all 0.3s;
    }
    .theme-toggle:hover {
      border-color: #D4AF37;
    }
    body.light-mode .theme-toggle {
      background: rgba(255, 255, 255, 0.9);
      color: #0A0A0A;
    }
    
    /* ===== BACK BUTTON ===== */
    .back-home {
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      color: #A8A29E;
      text-decoration: none;
      font-weight: 500;
      transition: color 0.3s;
      font-size: 0.95rem;
    }
    .back-home:hover {
      color: #D4AF37;
    }
    
    /* ===== UTILITIES ===== */
    .gold-line {
      width: 60px;
      height: 3px;
      background: linear-gradient(135deg, #B8860B, #D4AF37, #F5D061);
      margin: 0.5rem auto;
      border-radius: 4px;
    }
    .section-label {
      font-size: 0.75rem;
      font-weight: 700;
      letter-spacing: 0.15em;
      text-transform: uppercase;
      color: #D4AF37;
    }
    .text-secondary-custom {
      color: #A8A29E;
    }
    
    /* ===== ANIMATION CLASSES ===== */
    .gsap-reveal {
      opacity: 0;
      transform: translateY(30px);
    }
    
    /* ===== RESPONSIVE ===== */
    @media (max-width: 576px) {
      .auth-card {
        padding: 1.75rem 1.25rem;
      }
    }
  </style>
</head>
<body>

<!-- ===== BACK + THEME TOGGLE ===== -->
<div class="d-flex flex-wrap align-items-center justify-content-between mb-4">
  <a href="index.html" class="back-home">
    <svg width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M15 18l-6-6 6-6"/></svg>
    Back to Home
  </a>
  <button class="theme-toggle" onclick="toggleTheme()" aria-label="Toggle theme">
    <svg width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><circle cx="12" cy="12" r="5"/><path d="M12 1v2M12 21v2M4.22 4.22l1.42 1.42M18.36 18.36l1.42 1.42M1 12h2M21 12h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42"/></svg>
  </button>
</div>

<!-- ===== HEADING ===== -->
<div style="text-align:center; padding:0.5rem 0 1.5rem;">
  <h1 class="font-display" style="font-size:clamp(2rem, 5vw, 3rem); font-weight:700;">
    <span class="text-gradient">Welcome Back</span>
  </h1>
  <div class="gold-line"></div>
  <p style="font-size:1rem; color:#A8A29E; max-width:400px; line-height:1.7; margin:0.75rem auto 0;">
    Sign in to manage your events and bookings
  </p>
</div>

<!-- ===== LOGIN FORM ===== -->
<section style="padding:0 0 2rem 0;">
  <div class="container">
    <div class="row justify-content-center">
      <div class="col-lg-6 col-md-8 col-sm-10">
        <div class="auth-card gsap-reveal">
          <form id="login-form" novalidate>
            <div class="form-group">
              <label for="login-email" class="form-label">Email Address</label>
              <input type="email" id="login-email" name="email" class="form-input" placeholder="you@example.com" autocomplete="email" required />
            </div>

            <div class="form-group">
              <label for="login-password" class="form-label">Password</label>
              <div class="password-wrapper">
                <input type="password" id="login-password" name="password" class="form-input" placeholder="Enter your password" autocomplete="current-password" required />
                <button type="button" class="password-toggle" aria-label="Show password" onclick="togglePasswordVisibility()">
                  <svg width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
                </button>
              </div>
            </div>

            <div class="d-flex flex-wrap align-items-center justify-content-between mb-4">
              <label class="custom-checkbox">
                <input type="checkbox" name="remember" />
                Remember me
              </label>
              <a href="#" class="text-sm" style="color: var(--accent-gold); text-decoration: none; transition: color 0.3s;" onmouseover="this.style.textDecoration='underline'" onmouseout="this.style.textDecoration='none'">Forgot password?</a>
            </div>

            <button type="submit" class="btn-gold">Sign In</button>
          </form>

          <p class="text-center text-sm mt-4" style="color: var(--text-secondary);">
            Don't have an account? <a href="register.html" class="fw-semibold" style="color: var(--accent-gold); text-decoration: none; transition: color 0.3s;" onmouseover="this.style.textDecoration='underline'" onmouseout="this.style.textDecoration='none'">Create one</a>
          </p>
        </div>
      </div>
    </div>
  </div>
</section>

<!-- ===== FOOTER ===== -->
<footer style="text-align:center; padding:2rem 0 0.5rem; border-top:1px solid rgba(212,175,55,0.15); margin-top:1.5rem;">
  <p style="color:#78716C; font-size:0.8rem;">&copy; 2026 Asquare Events · All rights reserved.</p>
</footer>

<!-- Bootstrap JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

<!-- ===== GSAP ANIMATIONS ===== -->
<script>
  // Wait for GSAP and ScrollTrigger to load
  document.addEventListener('DOMContentLoaded', function() {
    // Check if GSAP is available
    if (typeof gsap !== 'undefined' && typeof ScrollTrigger !== 'undefined') {
      // Register ScrollTrigger plugin
      gsap.registerPlugin(ScrollTrigger);
      
      // Animate all elements with .gsap-reveal class
      gsap.utils.toArray('.gsap-reveal').forEach(function(el) {
        gsap.fromTo(el, 
          { opacity: 0, y: 40 },
          {
            opacity: 1,
            y: 0,
            duration: 0.8,
            ease: 'power3.out',
            scrollTrigger: {
              trigger: el,
              start: 'top 85%',
              toggleActions: 'play none none none'
            }
          }
        );
      });
    } else {
      // Fallback: show elements if GSAP doesn't load
      document.querySelectorAll('.gsap-reveal').forEach(function(el) {
        el.style.opacity = '1';
        el.style.transform = 'translateY(0)';
      });
    }
  });

  function applySavedTheme() {
    const isLight = localStorage.getItem('luxe-theme') === 'light';
    document.documentElement.classList.toggle('light', isLight);
    document.body.classList.toggle('light-mode', isLight);
  }

  function toggleTheme() {
    const nextIsLight = !document.documentElement.classList.contains('light');
    document.documentElement.classList.toggle('light', nextIsLight);
    document.body.classList.toggle('light-mode', nextIsLight);
    localStorage.setItem('luxe-theme', nextIsLight ? 'light' : 'dark');
  }

  document.addEventListener('DOMContentLoaded', applySavedTheme);

  // ===== PASSWORD TOGGLE =====
  function togglePasswordVisibility() {
    const passwordInput = document.getElementById('login-password');
    const toggleBtn = document.querySelector('.password-toggle');
    
    if (passwordInput.type === 'password') {
      passwordInput.type = 'text';
      toggleBtn.innerHTML = `
        <svg width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
          <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>
          <circle cx="12" cy="12" r="3"/>
          <line x1="1" y1="1" x2="23" y2="23" stroke="currentColor" stroke-width="2"/>
        </svg>
      `;
    } else {
      passwordInput.type = 'password';
      toggleBtn.innerHTML = `
        <svg width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
          <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>
          <circle cx="12" cy="12" r="3"/>
        </svg>
      `;
    }
  }
</script>

</body>
</html>
